name = "oui-academy-chatbot"
main = "src/index.js"
compatibility_date = "2026-08-01"

[ai]
binding = "AI"

# Serves the chatbot at https://ouiacademy.net/api/chat instead of a
# workers.dev subdomain, since the site's DNS already runs through
# Cloudflare. If this route fails to deploy (e.g. the zone isn't on
# your account), delete the block below and the worker will fall back
# to its default <name>.<your-subdomain>.workers.dev URL — just update
# CHAT_ENDPOINT in the site's chatbot-widget.js to match.
routes = [
  { pattern = "ouiacademy.net/api/chat", zone_name = "ouiacademy.net" }
]
