<style>
  :root{
    --ink:#141311; --yellow:#F4E600; --cream:#FFFDF6; --paper:#FFFFFF;
    --grey:#6E6B60; --line:#EAE5D2; --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:'Be Vietnam Pro', sans-serif; font-size:16px; line-height:1.6; min-height:100vh; display:flex; flex-direction:column;}
  h1{font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:640px; margin:0 auto; padding:0 28px; text-align:center;}

  header{padding:24px 0;}
  .logo-mark img{height:32px; margin:0 auto;}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 0;}
  .code{font-size:clamp(64px,14vw,120px); line-height:1; margin-bottom:8px;}
  .code .hl{background:var(--yellow); padding:0 12px;}
  h2{font-family:'Space Grotesk'; font-size:clamp(22px,3.2vw,28px); margin-bottom:14px;}
  p{color:var(--grey); font-size:15.5px; margin-bottom:8px;}
  p.en{margin-bottom:32px;}

  .ctas{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:14px 26px; font-weight:600; font-size:15px;
    border-radius:var(--radius); border:2px solid var(--ink);
    transition:all .15s ease;
  }
  .btn-primary{background:var(--ink); color:var(--cream);}
  .btn-primary:hover{background:#000; transform:translateY(-2px);}
  .btn-secondary{background:transparent; color:var(--ink);}
  .btn-secondary:hover{background:var(--ink); color:var(--cream);}

  footer{padding:30px 0; border-top:1px solid var(--line); text-align:center; font-size:12.5px; color:var(--grey);}
  .social-row{display:flex; gap:10px; align-items:center; justify-content:center; margin-bottom:16px;}
  .social-row a{
    width:34px; height:34px; border:2px solid var(--ink); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); transition:all .15s ease; flex-shrink:0;
  }
  .social-row a svg{width:15px; height:15px;}
  .social-row a:hover{background:var(--yellow); transform:translateY(-2px);}

  .sticky-cta{display:none;}
  @media (max-width:680px){
    .sticky-cta{
      display:block; position:fixed; left:0; right:0; bottom:0; z-index:80;
      background:var(--ink); padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      box-shadow:0 -2px 12px rgba(0,0,0,0.18);
    }
    .sticky-cta a{
      display:block; background:var(--yellow); color:var(--ink);
      font-weight:700; text-align:center; padding:13px; font-size:15px;
      border-radius:2px;
    }
    body{padding-bottom:64px;}
  }
</style>
</head>
